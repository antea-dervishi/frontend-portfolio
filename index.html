<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetARTists</title>
    <link rel="stylesheet" href="main.css" />
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="text-center">
            <h1>Street ARTists </h1>
            <hr>
        </div>
    </header>

    <div class="logo text-center p-4 m-0">
        <img src="images/logo.png">
    </div>
    <div class="container-fluid pb-4 d-flex justify-content-center align-items-center">
        <div class="container joinSection p-0 col-9 col-md-3 text-center">
            <div class="hoverWrapper2">
                <div class="divArtist pt-4 pb-5 p-0">
                    <a href="artist.html" id="joinArtist" class="artistLink text-decoration-none">
                        <h1>Join as Artist</h1>
                    </a>
                    <select id="artistSelect" class="select text-center bg-transparent" aria-label="Default select example">
                        <option selected>Choose</option>
                    </select>
                </div>
                <div class="separator2"></div>
</div>

                <div class="hoverWrapper">
                <div class="separator"></div>
            
    
            <div class="divVisitor pb-4 pt-5">
                <a href="visitor.html" id="joinVisitor" class="visitorLink text-decoration-none">
                    <h1>Join as Visitor</h1>
                </a>
            </div>
            </div>
        </div>
    </div>
    



    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/artists.js"></script>
</body>

</html>
