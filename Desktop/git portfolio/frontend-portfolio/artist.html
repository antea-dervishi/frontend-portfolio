<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetARTists</title>
    <link rel="stylesheet" href="main.css" />
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
   

</head>
<body>
   
<header>
    <div class="nav d-flex justify-content-between align-items-center p-0 m-0">
        <div class="nav-left d-flex align-items-center p-0 m-0">
            <img src="images/logo.png" class="nav-img m-2">
            <h1 id="artist-name">Artist Name</h1>
        </div>
        <!-- Hamburger menu -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"><i class="fa-solid fa-bars"></i></span>
        </button>
    </div>
    <hr class="m-0">
    
    <!-- Collapsible menu -->
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="artist.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="artist-item.html">Items</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="auctionPage.html">Auction</a>
            </li>
        </ul>
    </div>
</header>
    
    
    <main>
        <div class="widgets">
            <div class="d-flex">
            <div class="widget m-2">
                <h3>Total Items Sold</h3>
                <p id="total-items-sold">0/0</p>
            </div>
            <div class="widget m-2">
                <h3>Total Income</h3>
                <p id="total-income">$0</p>
            </div>
        </div>
            <div class="widget" style="background-color: #d44c2e;">
                <h3>Live Auctioning Item</h3>
                <p id="live-auction">$0</p>
                <small>current bid</small>
            </div>
        </div>
        <div class="chart-section">
            <h3>Display my income for last</h3>
            <div class="chart-controls">
                <button onclick="renderChart(7)" class="active">7 days</button>
                <button onclick="renderChart(14)">14 days</button>
                <button onclick="renderChart(30)">30 days</button>
            </div>
            <canvas id="income-chart"></canvas>
        </div>
        
    </main>
    <script src="js/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
           
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
