<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetARTists</title>
    <link rel="stylesheet" href="main.css" />
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="nav d-flex justify-content-between align-items-center p-0 m-0">
            <div class="nav-left d-flex align-items-center p-0 m-0">
                <img src="images/logo.png" class="nav-img m-2">
                <h1>Street ARTists </h1>
            </div>
            <a href="auctionPage.html"><img src="images/nav_icon.png" class="nav-img2"></a>
        </div>
        <hr class="m-0">
    </header>


    <div class="item-list"></div>
   
    <button id="floatingFilterBtn" class="floating-filter-btn"><img src="images/filter.png"></button>

    <!-- Filter Panel -->
    <div class="filter-panel">
        <button id="closeFilter" class="close-filter-btn"><i class="fa-solid fa-x"></i></button>
        <h2>Filter by</h2>
        <form id="filterForm">
         
            <div class="filter-group">
                <label for="title">By Item Title:</label>
                <input type="text" id="title" placeholder="Label">
            </div>
<hr class="hr-filter">
            
            <div class="filter-group">
                <label for="artistSelect">By Artist:</label>
                <select id="artistSelect">
                    <option value="">Choose</option>
                </select>
            </div>
<hr class="hr-filter">
           
            <div class="filter-group">
                <label>By Price:</label>
                Min: <input type="number" id="minPrice" placeholder="Label">
                Max: <input type="number" id="maxPrice" placeholder="Label ">
            </div>
<hr class="hr-filter">
           
            <div class="filter-group">
                <label for="typeSelect">By Type:</label>
                <select id="typeSelect">
                    <option value="">Choose</option>
                    <option value="Painting">Painting</option>
                    <option value="Sculpture">Sculpture</option>
                    <option value="Digital">Digital</option>
                </select>
            </div>
<hr class="hr-filter">
           
            <button type="button" id="applyFilter" class="apply-filter-btn"><img src="images/filter-save.png"></button>
        </form>
    </div>

    
   


    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/artists.js"></script>
</body>

</html>
