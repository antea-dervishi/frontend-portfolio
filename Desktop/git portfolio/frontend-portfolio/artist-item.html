<body>
   
<header>
    <div class="nav d-flex justify-content-between align-items-center p-0 m-0">
        <div class="nav-left d-flex align-items-center p-0 m-0">
            <img src="images/logo.png" class="nav-img m-2">
            <h1 id="artist-name">Artist Name</h1>
        </div>
        <!-- Hamburger menu -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"><i class="fa-solid fa-bars"></i></span>
        </button>
    </div>
    <hr class="m-0">
    
    <!-- Collapsible menu -->
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="artist.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="artist-item.html">Items</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="auctionPage.html">Auction</a>
            </li>
        </ul>
    </div>
</header>
    
    
<main>
    <div id="items-container" class="items-container">
        
        
    </div>


</main>

<div id="form-container" style="display: none;">
    <h2 id="form-title">Add New Item</h2>
    <div class="form-field">
        <label for="item-title">Title</label>
        <input type="text" id="item-title" placeholder="Title (required)" />
    </div>
    <div class="form-field">
        <label for="item-desc">Description</label>
        <textarea id="item-desc" placeholder="Description (optional)"></textarea>
    </div>
    <div class="form-row">
        <div class="form-field">
            <label for="item-type">Type</label>
            <select id="item-type">
                <option value="sale">Sale</option>
                <option value="auction">Auction</option>
            </select>
        </div>
        <div class="form-field">
            <label for="item-price">Price</label>
            <input type="number" id="item-price" placeholder="Price (required)" />
        </div>
    </div>
    <div class="form-field">
        <label for="item-img-url">Image URL</label>
        <input type="text" id="item-img-url" placeholder="Image URL (required)" />
    </div>
    <div class="snapshot-section" onclick="openCamera()">
        <i class="fa-solid fa-camera"></i>
        <p>Take a snapshot</p>
    </div>
    <div class="form-field">
        <label>
            <input type="checkbox" id="item-published" checked /> Is Published</label>
    </div>
    <div class="form-actions">
        <button id="save-item-btn">Add New Item</button>
        <button id="cancel-item-btn">Cancel</button>
    </div>
</div>

<div id="camera-modal" style="display: none;">
    <video id="camera-view" autoplay></video>
    <div id="camera-controls">
        <button id="capture-btn" onclick="captureSnapshot()">📸 Capture</button>
        <button id="close-camera-btn" onclick="closeCamera()">Close</button>
    </div>
</div>


   
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
        <script type="module" src="js/script.js"></script>
         <script type="module" src="js/artists.js"></script>
        <script type="module" src="js/items.js" defer > </script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </body>

</html>
